{# Language selector with the active locale represented by its flag. #}
<div class="md-header__option">
  <div class="md-select">
    <button class="md-header__button amrx-language-flag" aria-label="{{ lang.t('select.language') }}">
      {% if config.theme.language == "fr" %}
        <span aria-hidden="true">🇫🇷</span>
      {% elif config.theme.language == "de" %}
        <span aria-hidden="true">🇩🇪</span>
      {% elif config.theme.language == "ar" %}
        <span aria-hidden="true">🇹🇳</span>
      {% else %}
        <span aria-hidden="true">🇬🇧</span>
      {% endif %}
    </button>
    <div class="md-select__inner">
      <ul class="md-select__list">
        {% for alt in config.extra.alternate %}
          <li class="md-select__item">
            <a href="{{ alt.link | url }}" hreflang="{{ alt.lang }}" class="md-select__link">
              {{ alt.name }}
            </a>
          </li>
        {% endfor %}
      </ul>
    </div>
  </div>
</div>
