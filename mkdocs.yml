            Mechanical Platform: المنصة الميكانيكية
            Modules and Common Interface: الوحدات والواجهة المشتركة
            ROS 2 and Digital Twin: ROS 2 والتوأم الرقمي
            Overview: نظرة عامة
            ROS 2 Workspace: مساحة عمل ROS 2
            Simulation Guide: دليل المحاكاة
            Dual-arm Simulation: محاكاة الذراعين
            Navigation and Perception: الملاحة والإدراك
            Mapping and Nav2 Guide: دليل رسم الخرائط وNav2
            Operator Interfaces: واجهات المشغّل
            Web Dashboard: لوحة التحكم عبر الويب
            Digital Twin Maps: خرائط التوأم الرقمي
            Dashboard UX and Architecture: تجربة المستخدم وبنية لوحة التحكم
            Qt/QML HMI: واجهة Qt/QML
            Embedded and Electrical: الأنظمة المضمنة والكهربائية
            Implementation Status: حالة التنفيذ
            Mission Management: إدارة المهام
            Architecture and Flow: البنية ومسار التنفيذ
            System Architecture: بنية النظام
            Interface Table: جدول الواجهات
            Technical Reference: المرجع التقني
            Repository Map: خريطة المستودع
            Localization Guide: دليل الترجمة
            Contributing: المساهمة

nav:
  - Home: index.md
  - Project:
      - Current Baseline: project/baseline.md
      - Workstream Overview: project/workstreams.md
  - Engineering Workstreams:
      - Mechanical Platform: workstreams/mechanical-platform.md
      - Modules and Common Interface: workstreams/modules-interface.md
      - ROS 2 and Digital Twin:
          - Overview: workstreams/ros2-digital-twin.md
          - ROS 2 Workspace: robotics/ros-workspace.md
          - Simulation Guide: robotics/simulation.md
          - Dual-arm Simulation: robotics/dual-arm-simulation.md
      - Navigation and Perception:
          - Overview: workstreams/navigation-perception.md
          - Mapping and Nav2 Guide: robotics/navigation.md
      - Operator Interfaces:
          - Overview: workstreams/operator-interfaces.md
          - Web Dashboard: interfaces/dashboard.md
          - Digital Twin Maps: interfaces/digital-twin-maps.md
          - Dashboard UX and Architecture: frontend-dashboard-redesign.md
          - Qt/QML HMI: interfaces/qt-hmi.md
      - Embedded and Electrical:
          - Overview: workstreams/embedded-electrical.md
          - Implementation Status: embedded/implementation.md
  - Mission Management:
      - Architecture and Flow: mission-management/architecture.md
  - System Architecture:
      - Overview: system_architecture/architecture.md
      - Interface Table: system_architecture/interfaces.md
  - Technical Reference:
      - Repository Map: reference/repository-map.md
      - Localization Guide: reference/localization.md
  - Contributing: contributing.md

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
