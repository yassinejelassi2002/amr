# =============================================================================
# AMR-X  -  ros2_control / diff_drive_controller configuration
# =============================================================================
# This is the ALTERNATIVE control path. The default simulation uses the Gazebo
# DiffDrive *system plugin* (simplest, most stable for demos). If you instead
# want the full ros2_control framework (closer to the real robot, where a real
# hardware interface replaces the simulated one), use this config together with
# ign_ros2_control / gz_ros2_control and the <ros2_control> URDF block.
#
# Values mirror config/robot_params.yaml and project_specs.json.
# =============================================================================
controller_manager:
  ros__parameters:
    update_rate: 50          # Hz, matches encoder publish rate

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

# -----------------------------------------------------------------------------
diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    wheel_separation: 0.420       # m  (robot_params.yaml wheel.separation)
    wheel_radius: 0.0825          # m  (robot_params.yaml wheel.radius)

    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    # Odometry
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_footprint
    enable_odom_tf: true
    open_loop: false
    position_feedback: true

    # Command interface
    use_stamped_vel: false

    # Limits (from project_specs.json operating speeds + design accel)
    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 1.5        # operating_speed_max_mps
    linear.x.min_velocity: -1.5
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration: 1.0
    linear.x.min_acceleration: -1.0

    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 1.5
    angular.z.min_velocity: -1.5
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration: 2.0
    angular.z.min_acceleration: -2.0
