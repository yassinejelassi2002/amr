<!DOCTYPE html>
<html>
<head>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/roslibjs/1.3.0/roslib.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
    }

    .joystick {
      display: grid;
      grid-template-columns: 80px 80px 80px;
      grid-template-rows: 80px 80px 80px;
      gap: 8px;
      justify-content: center;
      margin-top: 30px;
    }

    .joystick button {
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background: #4a4a4a;
      color: white;
      cursor: pointer;
    }

    .joystick button:active {
      background: #2c2c2c;
    }

    #forward   { grid-column: 2; grid-row: 1; }
    #left      { grid-column: 1; grid-row: 2; }
    #stop      { grid-column: 2; grid-row: 2; background: #d9534f; }
    #right     { grid-column: 3; grid-row: 2; }
    #backward  { grid-column: 2; grid-row: 3; }
  </style>
</head>
<body>
  <h1>Status: <span id="status">Connecting...</span></h1>

  <div class="joystick">
    <button id="forward"
      onmousedown="startMove(0.2, 0.0)"
      onmouseup="stopMove()"
      onmouseleave="stopMove()">▲</button>

    <button id="left"
      onmousedown="startMove(0.0, 0.5)"
      onmouseup="stopMove()"
      onmouseleave="stopMove()">◀</button>

    <button id="stop" onclick="stopMove()">■</button>

    <button id="right"
      onmousedown="startMove(0.0, -0.5)"
      onmouseup="stopMove()"
      onmouseleave="stopMove()">▶</button>

    <button id="backward"
      onmousedown="startMove(-0.2, 0.0)"
      onmouseup="stopMove()"
      onmouseleave="stopMove()">▼</button>
  </div>
  <div id="imu-display" style="margin-top: 20px;">
    <h3>IMU</h3>
    <p>Angular velocity — x: <span id="imu-ang-x">0</span>, y: <span id="imu-ang-y">0</span>, z: <span id="imu-ang-z">0</span></p>
    <p>Linear acceleration — x: <span id="imu-lin-x">0</span>, y: <span id="imu-lin-y">0</span>, z: <span id="imu-lin-z">0</span></p>
  </div>
    <div id="state-display" style="margin-top: 20px;">
    <h3>Robot State</h3>
    <p>Mode: <span id="robot-mode">-</span></p>
    <p>Position — x: <span id="pos-x">0</span>, y: <span id="pos-y">0</span></p>
    <p>Linear velocity — x: <span id="lin-vel-x">0</span></p>
    <p>Angular velocity — z: <span id="ang-vel-z">0</span></p>
  </div>
    <div id="mode-selector" style="margin-top: 20px;">
    <h3>Set Mode</h3>
  <select id="mode-select">
    <option value="idle">Idle</option>
    <option value="navigation">Navigation</option>
    <option value="manipulation">Manipulation</option>
    <option value="combined">Combined</option>
  </select>
    <button onclick="setMode()">Apply</button>
    <p>Last result: <span id="mode-result">-</span></p>
  </div>

  <script>
    const ros = new ROSLIB.Ros({ url: 'ws://localhost:9090' });

    ros.on('connection', () => {
      document.getElementById('status').innerText = 'Connected';
    });
    ros.on('error', () => {
      document.getElementById('status').innerText = 'Error';
    });
    ros.on('close', () => {
      document.getElementById('status').innerText = 'Disconnected';
      stopMove();
    });

    const robotStateTopic = new ROSLIB.Topic({
      ros: ros,
      name: '/robot_state',
      messageType: 'amr_interfaces/msg/RobotState'
    });

    
    const imuTopic = new ROSLIB.Topic({
      ros: ros,
      name: '/imu',
      messageType: 'sensor_msgs/msg/Imu'
    });

    const setModeService = new ROSLIB.Service({
      ros: ros,
      name: '/set_mode',
      serviceType: 'amr_interfaces/srv/SetMode'
    });

    const cmdVel = new ROSLIB.Topic({
      ros: ros,
      name: '/cmd_vel',
      messageType: 'geometry_msgs/msg/Twist'
    });

    robotStateTopic.subscribe((message) => {
      document.getElementById('pos-x').innerText = message.base_pose.position.x.toFixed(2);
      document.getElementById('pos-y').innerText = message.base_pose.position.y.toFixed(2);
      document.getElementById('lin-vel-x').innerText = message.base_velocity.linear.x.toFixed(2);
      document.getElementById('ang-vel-z').innerText = message.base_velocity.angular.z.toFixed(2);
      document.getElementById('robot-mode').innerText = message.mode;
    });
    
    imuTopic.subscribe((message) => {
      document.getElementById('imu-ang-x').innerText = message.angular_velocity.x.toFixed(4);
      document.getElementById('imu-ang-y').innerText = message.angular_velocity.y.toFixed(4);
      document.getElementById('imu-ang-z').innerText = message.angular_velocity.z.toFixed(4);

      document.getElementById('imu-lin-x').innerText = message.linear_acceleration.x.toFixed(3);
      document.getElementById('imu-lin-y').innerText = message.linear_acceleration.y.toFixed(3);
      document.getElementById('imu-lin-z').innerText = message.linear_acceleration.z.toFixed(3);
    });

    let publishInterval = null;

    function publishTwist(linearX, angularZ) {
      const twist = new ROSLIB.Message({
        linear: { x: linearX, y: 0.0, z: 0.0 },
        angular: { x: 0.0, y: 0.0, z: angularZ }
      });
      cmdVel.publish(twist);
    }

    function startMove(linearX, angularZ) {
      stopMove();
      publishTwist(linearX, angularZ);
      publishInterval = setInterval(() => {
        publishTwist(linearX, angularZ);
      }, 100);
    }

    function stopMove() {
      if (publishInterval !== null) {
        clearInterval(publishInterval);
        publishInterval = null;
      }
      publishTwist(0.0, 0.0);
    }
    function setMode(modeName) {
      const selected = document.getElementById('mode-select').value;
      const request = new ROSLIB.ServiceRequest({ mode: selected });
      setModeService.callService(request, (result) => {
        document.getElementById('mode-result').innerText =
        result.success ? `OK: ${result.message}` : `Failed: ${result.message}`;
      });
    } 

  </script>
</body>
</html>
