moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

trajectory_execution:
  allowed_execution_duration_scaling: 2.0
  allowed_goal_duration_margin: 5.0
  allowed_start_tolerance: 0.02
moveit_simple_controller_manager:
  controller_names:
    - left_arm_controller
    - right_arm_controller
    - base_controller
    - pinion_position_controller

  left_arm_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - shoulder1_joint
      - shoulder2_joint
      - shoulder3_joint
      - shoulder4_joint
      - shoulder5_joint
      - shoulder6_joint
      - wrist_joint

  right_arm_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - shoulderR_joint
      - shoulderR_2_joint
      - shoulderR_3joint
      - shoulderR_4joint
      - shoulderR_5joint
      - shoulderR_6joint
      - wristR_joint

  base_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - robot_base_joint

  pinion_position_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - pinion_joint

